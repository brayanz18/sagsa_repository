server.port=8080
spring.application.name=sagsa-api

# Conexão com o Banco de Dados MySQL/MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/brayan_gabriel_sistema_sapz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=brayan_gabriel
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# 'validate' instrui o Hibernate a apenas checar se as entidades batem com o banco existente
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect